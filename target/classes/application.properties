# Catalog
# How long a product carries the "New" badge, counted from PUBLISHED_AT in UTC. The boundary is
# exclusive: at exactly this many days the badge is gone. One value, read by NewProductPolicy —
# it used to be a 30 * 86400000 literal inside a browser-side mapping function.
app.catalog.new-product-days=${NEW_PRODUCT_DAYS:30}
# Images per product. A merchandising limit, not a technical one; enforced server-side so a caller
# bypassing the admin UI cannot exceed it.
# Per VARIANT: one main image plus up to nine additional. Photography belongs to variants now,
# so the old per-product ceiling would have capped a three-colour family at ten photos total.
app.catalog.max-variant-images=${MAX_VARIANT_IMAGES:10}
app.email.outbox.poll-delay-ms=${EMAIL_OUTBOX_POLL_DELAY_MS:2000}
app.email.outbox.max-attempts=${EMAIL_OUTBOX_MAX_ATTEMPTS:8}
