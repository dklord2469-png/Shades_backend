# -------------------------------------------------------
# JPA / Hibernate
# -------------------------------------------------------
# Connection pool (HikariCP)
# -------------------------------------------------------
# Previously unset, which meant Hikari's default of 10 connections and NO acquisition timeout
# tuning — every request that could not get a connection simply waited 30s.
#
# Sizing formula, and why each number:
#   server capacity      : MySQL max_connections = 151 (measured, not assumed)
#   reserved             : 25 for migrations, the mysql CLI, monitoring and an admin session
#   available to apps    : 126
#   backend instances    : 1 (single instance — see DB_POOL_INSTANCES to re-derive if that changes)
#   ceiling per instance : 126
#
# The pool is NOT set to that ceiling. Throughput is bounded by cores, not by how many connections
# the server will tolerate: a pool larger than the database can service concurrently just moves
# queueing from the application into the database, where it is slower and harder to see. The
# working figure is the standard ((cores * 2) + effective spindles) ≈ 20 on this 24-core box, which
# sits far under the 126 ceiling and leaves headroom for a second instance without reconfiguration.
#
# connection-timeout is deliberately short. When the pool is exhausted the right behaviour is fast,
# visible backpressure — a controlled 500 the caller can retry — not a 30-second stall that ties up
# a request thread and makes the whole application look hung.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:3000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
# Under MySQL's default wait_timeout (28800s) by a wide margin, and short enough that a connection
# broken by an intermediate proxy is retired before a request finds it.
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1500000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_MS:300000}
# Surfaces a connection held far longer than any legitimate transaction here — which is exactly the
# symptom of doing slow work (an SMTP send, an HTTP call) while holding one.
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:30000}
spring.datasource.hikari.pool-name=ShadesWorldPool

# Bounds any transaction that would otherwise sit open indefinitely. Shorter than MySQL's
# innodb_lock_wait_timeout (50s) so the application gives up before the database does, and the
# resulting error is one we raise rather than a lock-wait surfacing from the driver.
spring.transaction.default-timeout=${DB_TX_TIMEOUT_SECONDS:30}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

