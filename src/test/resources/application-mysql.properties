# MySQL-backed test profile, for tests whose subject IS the database.
#
# The default test profile uses H2 in-memory. That is fine for wiring and business logic, but it
# cannot demonstrate anything about concurrency: H2's locking is not InnoDB's, so a test that
# "proves" SELECT ... FOR UPDATE serialises two writers under H2 has proved nothing about
# production. Concurrency tests therefore run here, against the same engine production uses.
#
# ddl-auto=validate, never create-drop: this points at a real schema that migrations own.
spring.datasource.url=${CONCURRENCY_DB_URL:jdbc:mysql://localhost:3306/ECOMMERCE_TEST_DB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Large enough that the test's own threads are not queued behind each other in the pool — otherwise
# the test would measure pool contention instead of database contention and quietly pass.
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.connection-timeout=10000

# The application does not send email during these tests, and expiry sweeps would race the fixtures.
app.email.outbox.enabled=false
app.orders.unpaid-expiry.enabled=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:0004}
